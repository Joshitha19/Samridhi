<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samridhi | AI-Based Credibility System for Smart Loan Approval</title>
  <meta name="description" content="Empowering credit-invisible gig workers, freelancers, students, and micro-entrepreneurs in India through AI-driven alternative underwriting and credit accessibility.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- React & Recharts Dependencies -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <!-- Recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js" crossorigin></script>

  <!-- Supabase JS Client UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF.js library UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>

  <!-- Tailwind CSS v3 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            samridhi: {
              bg: '#030712',
              surface: '#090e1a',
              card: '#0f172a',
              border: '#1e293b',
              primary: '#3b82f6',
              secondary: '#00E5FF',
              success: '#00E676',
              warning: '#facc15',
              danger: '#ef4444',
              textPrimary: '#FFFFFF',
              textMuted: '#8E91A8',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style type="text/css">
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #20202A;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    /* Keyframes and Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; filter: blur(20px); }
      50% { opacity: 0.3; filter: blur(30px); }
    }
    .glow-pulse-primary {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    /* Falling Cash Animation */
    @keyframes fallingCashAnim {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    .falling-cash-item {
      position: absolute;
      top: -100px;
      pointer-events: none;
      animation: fallingCashAnim 4.5s linear infinite;
      z-index: 1;
    }

    /* Grid glow pattern */
    .bg-grid-glow {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(59, 130, 246, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(59, 130, 246, 0.02) 1px, transparent 1px);
    }

    /* Custom utilities for gradients and borders */
    .border-gradient-green-lime {
      border-image: linear-gradient(to right, #3b82f6, #00E5FF) 1;
    }
    
    /* Backdrop blur fallback */
    .blur-nav {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Slide Up entrance animation */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 5 Tilted Coin Float animations for high perspective */
    @keyframes floatCoin1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes floatCoin2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
    }
    @keyframes floatCoin3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes floatCoin4 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-4deg); }
    }
    @keyframes floatCoin5 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }
    .animate-coin-1 { animation: floatCoin1 5s infinite ease-in-out; }
    .animate-coin-2 { animation: floatCoin2 4.2s infinite ease-in-out; }
    .animate-coin-3 { animation: floatCoin3 6s infinite ease-in-out; }
    .animate-coin-4 { animation: floatCoin4 4.8s infinite ease-in-out; }
    .animate-coin-5 { animation: floatCoin5 5.5s infinite ease-in-out; }

    /* Neon Pulsing Box Shadows */
    @keyframes neonGlowPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.1), inset 0 0 5px rgba(59, 130, 246, 0.05); }
      50% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3), inset 0 0 8px rgba(59, 130, 246, 0.1); }
    }
    .animate-neon-glow {
      animation: neonGlowPulse 2.5s infinite ease-in-out;
    }

    /* Green Hover Glow card effect */
    .hover-glow-green {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-glow-green:hover {
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
      border-color: rgba(0, 230, 118, 0.4);
      transform: translateY(-2px);
    }

    /* Premium Glassmorphic FinTech styling */
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      background: rgba(22, 33, 62, 0.55);
      border-color: rgba(0, 229, 255, 0.15);
      box-shadow: 0 12px 40px 0 rgba(0, 229, 255, 0.04);
      transform: translateY(-1px);
    }
    .border-glow-primary {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .border-glow-primary:hover {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.35);
      transform: translateY(-1px);
    }
    .border-glow-secondary {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .border-glow-secondary:hover {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
      border-color: rgba(0, 229, 255, 0.35);
      transform: translateY(-1px);
    }
    .border-glow-success {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .border-glow-success:hover {
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
      border-color: rgba(0, 230, 118, 0.35);
      transform: translateY(-1px);
    }
    .text-glow-primary {
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }
    .text-glow-secondary {
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }
    .text-glow-success {
      text-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
    }
  </style>
</head>
<body class="bg-samridhi-bg text-samridhi-textPrimary font-sans antialiased overflow-x-hidden">
  
  <div id="root"></div>

  <!-- 5. Parent Dashboard View enclosing layout -->
  <script type="text/babel" src="views/DashboardView.js?v=1.0.1"></script>
  <script type="text/babel" src="views/BankerDashboardView.js?v=1.0.1"></script>

  <!-- 6. Entry coordinator routing shell -->
  <script type="text/babel" src="app.js?v=1.0.1"></script>

</body>
</html>
