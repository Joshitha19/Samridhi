<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samridhi | AI-Based Credibility System for Smart Loan Approval</title>
  <meta name="description" content="Empowering credit-invisible gig workers, freelancers, students, and micro-entrepreneurs in India through AI-driven alternative underwriting and credit accessibility.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- React & Recharts Dependencies -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <!-- Recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js" crossorigin></script>

  <!-- Supabase JS Client UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF.js library UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>

  <!-- Tailwind CSS v3 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            samridhi: {
              bg: '#040806',
              surface: '#0A0F0C',
              card: '#0E1612',
              border: '#1C2E25',
              primary: '#00E676',
              secondary: '#B2FF59',
              success: '#00E676',
              warning: '#FFD600',
              danger: '#FF1744',
              textPrimary: '#E8F5E9',
              textMuted: '#759F87',
            }
          },
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style type="text/css">
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #040806;
    }
    ::-webkit-scrollbar-thumb {
      background: #1C2E25;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00E676;
    }

    /* Keyframes and Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; filter: blur(20px); }
      50% { opacity: 0.3; filter: blur(30px); }
    }
    .glow-pulse-primary {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    /* Falling Cash Animation */
    @keyframes fallingCashAnim {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    .falling-cash-item {
      position: absolute;
      top: -100px;
      pointer-events: none;
      animation: fallingCashAnim 4.5s linear infinite;
      z-index: 1;
    }

    /* Grid glow pattern */
    .bg-grid-glow {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 230, 118, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 230, 118, 0.03) 1px, transparent 1px);
    }

    /* Custom utilities for gradients and borders */
    .border-gradient-green-lime {
      border-image: linear-gradient(to right, #00E676, #B2FF59) 1;
    }
    
    /* Backdrop blur fallback */
    .blur-nav {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Slide Up entrance animation */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Floating SVG coins/elements */
    @keyframes floatCoin {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(8deg); }
    }
    .animate-float-coin {
      animation: floatCoin 3.5s infinite ease-in-out;
    }

    /* Neon Pulsing Box Shadows */
    @keyframes neonGlowPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 230, 118, 0.1), inset 0 0 5px rgba(0, 230, 118, 0.05); }
      50% { box-shadow: 0 0 15px rgba(0, 230, 118, 0.3), inset 0 0 8px rgba(0, 230, 118, 0.1); }
    }
    .animate-neon-glow {
      animation: neonGlowPulse 2.5s infinite ease-in-out;
    }

    /* Green Hover Glow card effect */
    .hover-glow-green {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-glow-green:hover {
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.18);
      border-color: rgba(0, 230, 118, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-samridhi-bg text-samridhi-textPrimary font-sans antialiased overflow-x-hidden">
  
  <div id="root"></div>

  <!-- Sequential Babel script loads for modular architecture -->
  
  <!-- 1. Underwriting Machine Learning core parameters -->
  <script type="text/babel" src="ml_engine.js"></script>

  <!-- 2. UI Shared Component Elements -->
  <script type="text/babel" src="components/icons.js"></script>
  <script type="text/babel" src="components/CircularGauge.js"></script>
  <script type="text/babel" src="components/LoanWizard.js"></script>

  <!-- 3. Primary Page/App Navigation Views -->
  <script type="text/babel" src="views/LandingPageView.js"></script>
  <script type="text/babel" src="views/SignInPageView.js"></script>
  <script type="text/babel" src="views/SignUpPageView.js"></script>

  <!-- 4. Sub-tabs displaying inside Dashboard View container -->
  <script type="text/babel" src="views/DashboardOverviewTab.js"></script>
  <script type="text/babel" src="views/DashboardScoreTab.js"></script>
  <script type="text/babel" src="views/DashboardSimulatorTab.js"></script>
  <script type="text/babel" src="views/DashboardTransactionsTab.js"></script>
  <script type="text/babel" src="views/DashboardInventoryTab.js"></script>
  <script type="text/babel" src="views/DashboardRecommendationsTab.js"></script>
  <script type="text/babel" src="views/DashboardProfileTab.js"></script>

  <!-- 5. Parent Dashboard View enclosing layout -->
  <script type="text/babel" src="views/DashboardView.js"></script>

  <!-- 6. Entry coordinator routing shell -->
  <script type="text/babel" src="app.js"></script>

</body>
</html>
